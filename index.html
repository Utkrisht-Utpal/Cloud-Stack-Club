<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('cloud_stack_theme_preference');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Cloud Stack Club | Chandigarh University</title>
    <meta name="title" content="Cloud Stack Club | Chandigarh University" />
    <meta name="description" content="A technical club empowering students at Chandigarh University to explore, learn and build innovative solutions through hands-on cloud experience, DevOps, and full stack engineering." />
    <meta name="keywords" content="Cloud Stack Club, Chandigarh University, CU, Cloud Computing, DevOps, AWS, Kubernetes, Docker, React, Technical Club" />
    <meta name="author" content="Utkrisht Utpal" />
    <meta name="theme-color" content="#070a12" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cloudstackclub.cu.ac.in/" />
    <meta property="og:title" content="Cloud Stack Club | Chandigarh University" />
    <meta property="og:description" content="A technical club empowering students to explore, learn and build innovative cloud solutions through hands-on experience." />
    <meta property="og:image" content="https://cloudstack-official.vercel.app/cloudstack_preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cloudstackclub.cu.ac.in/" />
    <meta property="twitter:title" content="Cloud Stack Club | Chandigarh University" />
    <meta property="twitter:description" content="A technical club empowering students to explore, learn and build innovative cloud solutions." />
    <meta property="twitter:image" content="https://cloudstack-official.vercel.app/cloudstack_preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
